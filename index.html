<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArtCorner – ตลาดงานศิลป์นักศึกษา</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<header id="hd"></header>
<main id="app"></main><button id="up" aria-label="ขึ้นบนสุด" onclick="scrollTo({top:0,behavior:'smooth'})">⌃</button><div id="toast"></div>
<script>
/* ตัวช่วยวินิจฉัย: ถ้าเว็บไม่แสดงอะไรเลยภายใน 4 วินาที จะแสดงข้อความ error บนหน้าจอ */
(function(){var errs=[];window.addEventListener('error',function(e){errs.push((e.message||'error')+(e.filename?' @ '+e.filename.split('/').pop()+':'+e.lineno:''))});
setTimeout(function(){var h=document.getElementById('hd'),a=document.getElementById('app');
if(h&&a&&!h.innerHTML.trim()&&!a.innerHTML.trim()){a.innerHTML='<div style="max-width:560px;margin:60px auto;padding:16px;border:2px solid #d93025;border-radius:6px;font:15px/1.6 sans-serif;background:#fff;color:#222"><b>โหลดเว็บไม่สำเร็จ</b><br>'+(errs.length?'ข้อผิดพลาด: <code>'+errs.join('<br>').replace(/</g,'&lt;')+'</code>':'ไม่พบการทำงานของ app.js — ลองเปิด /app.js ในเบราว์เซอร์ ต้องเห็นโค้ดที่ขึ้นต้นด้วย “let REMOTE”')+'<br><small>กด Ctrl+Shift+R เพื่อโหลดใหม่ แล้วส่งข้อความนี้ให้ผู้พัฒนา</small></div>'}},4000)})();
</script>
<script src="qr.js"></script>
<script src="app.js"></script></body></html>
